<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LogiCurrent M&T+</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0a0e27; color: #e0e0e0; }
    #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0a0e27; display: flex; justify-content: center; align-items: center; z-index: 9999; }
    .login-box { background: #1a1f3a; padding: 30px; border-radius: 8px; width: 100%; max-width: 320px; text-align: center; }
    .login-box h2 { margin-bottom: 20px; color: #d4af37; }
    input { width: 100%; padding: 10px; margin-bottom: 10px; background: #2a2f4a; border: 1px solid #444; color: #e0e0e0; border-radius: 4px; }
    button { width: 100%; padding: 10px; margin: 5px 0; background: #d4af37; color: #000; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    #app-header { display: none; padding: 15px; background: #1a1f3a; }
    #logout-btn { display: none; }
    #error-msg { color: #ff6b6b; font-size: 12px; margin-top: 10px; }
  </style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h2>LogiCurrent M&T+</h2>
    <input type="email" id="login-email" placeholder="Email">
    <input type="password" id="login-password" placeholder="Password">
    <button onclick="crewLogin()">Sign In</button>
    <button onclick="toggleSignUp()">New Member?</button>
    <div id="error-msg"></div>
  </div>
</div>

<div id="app-header">
  <span id="header-label"></span>
  <button id="logout-btn" onclick="crewLogout()">Logout</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCXJ2QIgeyqq_rC13uSHoJgB2AZPrx4ykw",
  authDomain: "logicurrent.firebaseapp.com",
  databaseURL: "https://logicurrent-default-rtdb.firebaseio.com",
  projectId: "logicurrent",
  storageBucket: "logicurrent.firebasestorage.app",
  messagingSenderId: "862945864559",
  appId: "1:862945864559:web:244f09832c78758b51969a"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

let currentUser = null;
let currentUserEmail = '';

function crewLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errorDiv = document.getElementById('error-msg');
  
  if (!email || !password) {
    errorDiv.textContent = 'Email and password required';
    return;
  }
  
  auth.signInWithEmailAndPassword(email, password)
    .then(user => {
      currentUser = user.user;
      currentUserEmail = user.user.email;
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app-header').style.display = 'block';
      document.getElementById('logout-btn').style.display = 'block';
      document.getElementById('header-label').textContent = 'Welcome: ' + currentUserEmail;
    })
    .catch(err => {
      errorDiv.textContent = err.message;
    });
}

function crewSignUp() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errorDiv = document.getElementById('error-msg');
  
  if (!email || password.length < 6) {
    errorDiv.textContent = 'Email required, password 6+ chars';
    return;
  }
  
  auth.createUserWithEmailAndPassword(email, password)
    .then(user => {
      currentUser = user.user;
      currentUserEmail = user.user.email;
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app-header').style.display = 'block';
      document.getElementById('logout-btn').style.display = 'block';
      document.getElementById('header-label').textContent = 'Welcome: ' + currentUserEmail;
    })
    .catch(err => {
      errorDiv.textContent = err.message;
    });
}

function toggleSignUp() {
  const btn = event.target;
  const submitBtn = document.querySelector('button[onclick="crewLogin()"]');
  
  if (btn.dataset.mode === 'login') {
    btn.dataset.mode = 'signup';
    btn.textContent = 'Back to Login';
    submitBtn.textContent = 'Sign Up';
    submitBtn.onclick = function() { crewSignUp(); };
  } else {
    btn.dataset.mode = 'login';
    btn.textContent = 'New Member?';
    submitBtn.textContent = 'Sign In';
    submitBtn.onclick = function() { crewLogin(); };
  }
}

function crewLogout() {
  auth.signOut().then(() => {
    currentUser = null;
    currentUserEmail = '';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app-header').style.display = 'none';
    document.getElementById('login-email').value = '';
    document.getElementById('login-password').value = '';
    document.getElementById('error-msg').textContent = '';
  });
}

auth.onAuthStateChanged(user => {
  if (user) {
    currentUser = user;
    currentUserEmail = user.email;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-header').style.display = 'block';
    document.getElementById('logout-btn').style.display = 'block';
    document.getElementById('header-label').textContent = 'Welcome: ' + user.email;
  } else {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app-header').style.display = 'none';
  }
});

console.log('✅ Auth script loaded successfully');
</script>

</body>
</html>
