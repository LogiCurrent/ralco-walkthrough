<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LogiCurrent M&T+</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0e27;
      color: #e0e0e0;
    }
    
    #login-screen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #0a0e27;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    
    .login-box {
      background: #1a1f3a;
      padding: 30px;
      border-radius: 8px;
      width: 100%;
      max-width: 320px;
      text-align: center;
    }
    
    .login-box h2 {
      margin-bottom: 20px;
      color: #d4af37;
      font-size: 28px;
    }
    
    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      background: #2a2f4a;
      border: 1px solid #444;
      color: #e0e0e0;
      border-radius: 4px;
    }
    
    button {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      background: #d4af37;
      color: #000;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    
    #app-screen {
      display: none;
      height: 100vh;
      flex-direction: column;
    }
    
    header {
      background: #1a1f3a;
      padding: 15px;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    header span {
      color: #d4af37;
      font-weight: bold;
    }
    
    #logout-btn {
      padding: 6px 12px;
      font-size: 12px;
      background: #ff6b6b;
      color: #fff;
    }
    
    main {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    
    .sites-list {
      display: grid;
      gap: 10px;
    }
    
    .site-card {
      background: #1a1f3a;
      padding: 15px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid #333;
      transition: all 0.2s;
    }
    
    .site-card:hover {
      border-color: #d4af37;
      background: #222540;
    }
    
    .site-card h3 {
      color: #d4af37;
      margin-bottom: 5px;
    }
    
    .site-card p {
      font-size: 12px;
      color: #999;
    }
    
    #error-msg {
      color: #ff6b6b;
      font-size: 12px;
      margin-top: 10px;
      text-align: center;
    }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="login-box">
    <h2>LogiCurrent</h2>
    <p style="color: #d4af37; font-size: 14px; margin-bottom: 20px;">M&T+</p>
    <input type="email" id="login-email" placeholder="Email">
    <input type="password" id="login-password" placeholder="Password">
    <button onclick="crewLogin()">Sign In</button>
    <button onclick="toggleSignUp()">New Member?</button>
    <div id="error-msg"></div>
  </div>
</div>

<!-- APP SCREEN -->
<div id="app-screen">
  <header>
    <div>
      <h1 style="font-size: 20px; margin-bottom: 5px;">LogiCurrent</h1>
      <span id="header-label">Loading...</span>
    </div>
    <button id="logout-btn" onclick="crewLogout()">Logout</button>
  </header>
  
  <main id="app-main">
    <div id="sites-view" class="hidden">
      <div style="margin-bottom: 15px;">
        <h2 style="color: #d4af37; margin-bottom: 10px;">Sites</h2>
        <button onclick="alert('New Site feature coming soon')" style="width: auto; padding: 8px 16px; font-size: 12px;">+ New Site</button>
      </div>
      <div class="sites-list" id="sites-list"></div>
    </div>
    
    <div id="site-detail-view" class="hidden">
      <button onclick="goBack()" style="margin-bottom: 15px; width: auto; background: #444;">← Back</button>
      <div id="site-detail-content"></div>
    </div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-auth-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-database-compat.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>

<script defer>
// ═══════════════════════════════════════════════════════
// FIREBASE INIT
// ═══════════════════════════════════════════════════════

const firebaseConfig = {
  apiKey: "AIzaSyCXJ2QIgeyqq_rC13uSHoJgB2AZPrx4ykw",
  authDomain: "logicurrent.firebaseapp.com",
  databaseURL: "https://logicurrent-default-rtdb.firebaseio.com",
  projectId: "logicurrent",
  storageBucket: "logicurrent.firebasestorage.app",
  messagingSenderId: "862945864559",
  appId: "1:862945864559:web:244f09832c78758b51969a"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

let currentUser = null;
let currentUserEmail = '';
let currentSite = null;

// ═══════════════════════════════════════════════════════
// AUTH FUNCTIONS
// ═══════════════════════════════════════════════════════

function crewLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errorDiv = document.getElementById('error-msg');
  
  if (!email || !password) {
    errorDiv.textContent = 'Email and password required';
    return;
  }
  
  auth.signInWithEmailAndPassword(email, password)
    .then(user => {
      currentUser = user.user;
      currentUserEmail = user.user.email;
      showAppScreen();
      loadSites();
    })
    .catch(err => {
      errorDiv.textContent = err.message;
    });
}

function crewSignUp() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errorDiv = document.getElementById('error-msg');
  
  if (!email || password.length < 6) {
    errorDiv.textContent = 'Email required, password 6+ chars';
    return;
  }
  
  auth.createUserWithEmailAndPassword(email, password)
    .then(user => {
      currentUser = user.user;
      currentUserEmail = user.user.email;
      showAppScreen();
      loadSites();
    })
    .catch(err => {
      errorDiv.textContent = err.message;
    });
}

function toggleSignUp() {
  const btn = event.target;
  const emailInput = document.getElementById('login-email');
  const passwordInput = document.getElementById('login-password');
  const submitBtn = document.querySelector('button[onclick="crewLogin()"]');
  
  if (btn.dataset.mode === 'login') {
    btn.dataset.mode = 'signup';
    btn.textContent = 'Back to Login';
    emailInput.placeholder = 'New email';
    passwordInput.placeholder = 'Password (6+ chars)';
    submitBtn.textContent = 'Create Account';
    submitBtn.onclick = function() { crewSignUp(); };
  } else {
    btn.dataset.mode = 'login';
    btn.textContent = 'New Member?';
    emailInput.placeholder = 'Email';
    passwordInput.placeholder = 'Password';
    submitBtn.textContent = 'Sign In';
    submitBtn.onclick = function() { crewLogin(); };
  }
}

function crewLogout() {
  auth.signOut().then(() => {
    currentUser = null;
    currentUserEmail = '';
    currentSite = null;
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app-screen').style.display = 'none';
    document.getElementById('login-email').value = '';
    document.getElementById('login-password').value = '';
    document.getElementById('error-msg').textContent = '';
  });
}

// ═══════════════════════════════════════════════════════
// UI FUNCTIONS
// ═══════════════════════════════════════════════════════

function showAppScreen() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'flex';
  document.getElementById('header-label').textContent = currentUserEmail;
}

function goBack() {
  document.getElementById('sites-view').classList.remove('hidden');
  document.getElementById('site-detail-view').classList.add('hidden');
  currentSite = null;
}

function viewSite(siteId) {
  db.ref('sites/' + siteId).once('value', snapshot => {
    currentSite = snapshot.val();
    if (!currentSite) {
      alert('Site not found');
      return;
    }
    currentSite.id = siteId;
    
    document.getElementById('sites-view').classList.add('hidden');
    document.getElementById('site-detail-view').classList.remove('hidden');
    renderSiteDetail();
  });
}

function renderSiteDetail() {
  const html = `
    <h2 style="color: #d4af37; margin-bottom: 15px;">${currentSite.name || currentSite.customer || 'Site'}</h2>
    
    <div style="background: #1a1f3a; padding: 15px; border-radius: 6px; margin-bottom: 15px;">
      <div><strong>Customer:</strong> ${currentSite.customer || '—'}</div>
      <div><strong>Address:</strong> ${currentSite.address || '—'}</div>
      <div style="margin-top: 10px;">
        <button onclick="exportEPMMaster()" style="width: auto; padding: 8px 16px; font-size: 12px; margin-right: 8px;">📥 Export EPM Master</button>
        <button onclick="exportSalesBuilder()" style="width: auto; padding: 8px 16px; font-size: 12px;">📥 Export Sales Builder</button>
      </div>
    </div>
    
    <div style="background: #1a1f3a; padding: 15px; border-radius: 6px;">
      <h3 style="color: #d4af37; margin-bottom: 10px;">Contracts</h3>
      <div id="contracts-list" style="font-size: 12px; color: #999;">Loading contracts...</div>
    </div>
  `;
  
  document.getElementById('site-detail-content').innerHTML = html;
  loadContracts();
}

function loadContracts() {
  const contracts = currentSite.contracts || [];
  const html = contracts.length 
    ? contracts.map(c => `<div style="padding: 8px 0; border-bottom: 1px solid #333;">${c.name || c.id}</div>`).join('')
    : '<div style="color: #666;">No contracts</div>';
  
  document.getElementById('contracts-list').innerHTML = html;
}

// ═══════════════════════════════════════════════════════
// SITES LOADING
// ═══════════════════════════════════════════════════════

function loadSites() {
  db.ref('sites').once('value', snapshot => {
    const data = snapshot.val() || {};
    const sitesList = Object.keys(data).map(id => ({
      id,
      ...data[id]
    }));
    
    renderSitesList(sitesList);
  });
}

function renderSitesList(sites) {
  const html = sites.length
    ? sites.map(site => `
        <div class="site-card" onclick="viewSite('${site.id}')">
          <h3>${site.name || site.customer || 'Site'}</h3>
          <p>${site.customer || '—'}</p>
          <p style="font-size: 11px; color: #666; margin-top: 5px;">${site.address || '—'}</p>
        </div>
      `).join('')
    : '<div style="color: #666; text-align: center; padding: 30px;">No sites yet</div>';
  
  document.getElementById('sites-list').innerHTML = html;
  document.getElementById('sites-view').classList.remove('hidden');
}

// ═══════════════════════════════════════════════════════
// EXPORTS
// ═══════════════════════════════════════════════════════

function exportEPMMaster() {
  if (!currentSite) return alert('No site selected');
  
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet([
    ['EPM Master', currentSite.name || currentSite.customer],
    ['Generated', new Date().toISOString()],
    [],
    ['Asset Tag', 'Location', 'Equipment Type', 'Status']
  ]);
  
  XLSX.utils.book_append_sheet(wb, ws, 'Equipment');
  XLSX.writeFile(wb, 'EPM_Master_' + (currentSite.name || 'Site') + '.xlsx');
}

function exportSalesBuilder() {
  if (!currentSite) return alert('No site selected');
  
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet([
    ['Sales Builder', currentSite.name || currentSite.customer],
    ['Generated', new Date().toISOString()],
    [],
    ['Item', 'Qty', 'Hours', 'Rate', 'Total']
  ]);
  
  XLSX.utils.book_append_sheet(wb, ws, 'Summary');
  XLSX.writeFile(wb, 'Sales_Builder_' + (currentSite.name || 'Site') + '.xlsx');
}

// ═══════════════════════════════════════════════════════
// AUTH STATE
// ═══════════════════════════════════════════════════════

auth.onAuthStateChanged(user => {
  if (user) {
    currentUser = user;
    currentUserEmail = user.email;
    showAppScreen();
    loadSites();
  } else {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app-screen').style.display = 'none';
  }
});

console.log('✅ App loaded successfully');
</script>

</body>
</html>
